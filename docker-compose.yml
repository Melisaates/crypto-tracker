services:
  backend:
    build: ./backend
    container_name: crypto-backend
    ports:
      - "3000:3000"
    networks:
      - appNet
    depends_on:
      - postgres
      - redis
  
  worker:
    build: ./worker
    container_name: crypto-worker
    networks:
      - appNet
    depends_on:
      - postgres
      - redis
      
  postgres:
    container_name: crypto-postgres
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cryptodb
    ports:
      - "5432:5432"
    networks:
      - appNet
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    container_name: crypto-redis
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - appNet
    
volumes:
  redis-data:
  postgres-data:
  
networks:
  appNet:
    driver: bridge